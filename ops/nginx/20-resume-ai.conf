# Reject direct-IP and unknown-Host traffic on both public listeners.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/siyuanjiaxin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siyuanjiaxin.com/privkey.pem;
    access_log off;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.siyuanjiaxin.com;
    access_log off;
    return 301 https://siyuanjiaxin.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.siyuanjiaxin.com;

    ssl_certificate /etc/letsencrypt/live/siyuanjiaxin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siyuanjiaxin.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:resume_ai_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log off;
    include /etc/nginx/snippets/resume-ai-transport-security.conf;
    return 301 https://siyuanjiaxin.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name siyuanjiaxin.com;
    access_log off;
    return 308 https://siyuanjiaxin.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name siyuanjiaxin.com;

    ssl_certificate /etc/letsencrypt/live/siyuanjiaxin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siyuanjiaxin.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:resume_ai_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/resume-ai-access.log resume_ai_json;
    # Client/request errors include raw client addresses in Nginx's built-in
    # format. Keep this channel to process-level critical failures only.
    error_log /var/log/nginx/resume-ai-error.log crit;
    client_max_body_size 256k;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;
    # Keep limit_req's default client-IP message below this server's critical log
    # threshold. The JSON access log records the 429/request ID without an IP.
    limit_req_log_level info;

    include /etc/nginx/snippets/resume-ai-transport-security.conf;
    error_page 429 = @resume_ai_gateway_rate_limited;

    # Loopback-only proof of the quota generation loaded by the live workers.
    location = /__resume_ai_quota_generation {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        access_log off;
        default_type text/plain;
        return 200 "$resume_ai_quota_generation\n";
    }

    location = /api/competitions/recommend/normalize {
        include /etc/nginx/snippets/resume-ai-recommend-quota.inc;
        include /etc/nginx/snippets/resume-ai-proxy-common.conf;
        proxy_read_timeout 75s;
        proxy_pass http://resume_ai_active;
    }

    location = /api/ai/competition-clarify {
        include /etc/nginx/snippets/resume-ai-recommend-quota.inc;
        include /etc/nginx/snippets/resume-ai-proxy-common.conf;
        proxy_read_timeout 75s;
        proxy_pass http://resume_ai_active;
    }

    location = /api/ai/competition-recommend {
        include /etc/nginx/snippets/resume-ai-recommend-quota.inc;
        include /etc/nginx/snippets/resume-ai-proxy-common.conf;
        proxy_read_timeout 75s;
        proxy_pass http://resume_ai_active;
    }

    location = /api/track {
        include /etc/nginx/snippets/resume-ai-track-quota.inc;
        include /etc/nginx/snippets/resume-ai-proxy-common.conf;
        proxy_read_timeout 75s;
        proxy_pass http://resume_ai_active;
    }

    location / {
        include /etc/nginx/snippets/resume-ai-proxy-common.conf;
        proxy_read_timeout 75s;
        proxy_pass http://resume_ai_active;
    }

    location @resume_ai_gateway_rate_limited {
        include /etc/nginx/snippets/resume-ai-transport-security.conf;
        default_type application/json;
        add_header Retry-After "1" always;
        add_header X-RateLimit-Source "gateway" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"ok":false,"error":"RATE_LIMITED","retryAfter":1,"source":"gateway","bucket":"ip-minute","requestId":"$request_id"}';
    }
}

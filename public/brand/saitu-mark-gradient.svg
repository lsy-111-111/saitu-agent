  <g mask="url(#saitu-orbit-cutout)" stroke="url(#saitu-orbit-gradient)" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="128" cy="128" rx="88" ry="101" transform="rotate(-12 128 128)" stroke-width="7.5" />
    <ellipse cx="128" cy="128" rx="111" ry="47" transform="rotate(-28 128 128)" stroke-width="8.5" />
  </g>
  <path fill="url(#saitu-star-gradient)" fill-rule="evenodd" clip-rule="evenodd" d="M128 52C134.5 95.2 146.2 116.5 184 128C146.2 139.5 134.5 160.8 128 204C121.5 160.8 109.8 139.5 72 128C109.8 116.5 121.5 95.2 128 52ZM128 104C130.4 117.3 138.7 125.6 152 128C138.7 130.4 130.4 138.7 128 152C125.6 138.7 117.3 130.4 104 128C117.3 125.6 125.6 117.3 128 104Z" />
  <circle cx="218" cy="75" r="10" fill="url(#saitu-node-gradient)" />
  <circle cx="39" cy="181" r="9" fill="#4338CA" />
